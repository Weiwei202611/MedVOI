[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvoi"
version = "0.1.0"
description = "Patient-specific conditional information value for adaptive multimodal medical AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "nibabel>=5.2",
  "torch>=2.2"
]

[tool.setuptools.packages.find]
include = ["medvoi*"]
