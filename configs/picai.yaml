name: picai
output_dir: outputs/picai

dataset:
  manifest: data/manifests/picai.csv
  task: classification
  sources: [t2w, dwi, adc]
  label_col: label
  target_shape: [96, 128, 128]
  normalize: true

model:
  task_model: class3d
  base_channels: 24
  hidden: 128

training:
  seed: 2026
  device: cuda
  batch_size: 2
  num_workers: 4
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 120
  early_stopping_patience: 15
  modality_dropout: {"1": 0.40, "2": 0.40, "3": 0.20}

crossfit: {folds: 5, epochs: 80}
value_model:
  candidate_dim: 32
  hidden: [256, 128]
  dropout: 0.10
  lr: 0.001
  weight_decay: 0.00001
  batch_size: 256
  epochs: 100
  ranking_weight: 0.50
  ranking_tolerance: 0.01
policy:
  initial_subset: [1, 0, 0]
  tau: 0.01
  beta: 0.0
  lambda_cost: 0.0
  costs: [1.0, 1.0, 1.0]
baselines: {direct_epochs: 100, direct_lr: 0.001, rl_epochs: 30, rl_lr: 0.001, rl_gamma: 0.95}
evaluation: {gain_bins: 8, bootstrap_resamples: 10000}
