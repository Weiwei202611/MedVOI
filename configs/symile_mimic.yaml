name: symile_mimic
output_dir: outputs/symile_mimic

dataset:
  manifest: data/manifests/symile_mimic.csv
  task: classification
  sources: [cxr, ecg, labs]
  source_types: {cxr: image2d, ecg: ecg, labs: labs}
  label_col: label
  normalize: false

model:
  task_model: hetero_class
  latent: 128
  labs_dim: 50

training:
  seed: 2026
  device: cuda
  batch_size: 16
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.00001
  epochs: 100
  early_stopping_patience: 15
  modality_dropout: {"1": 0.40, "2": 0.40, "3": 0.20}

crossfit: {folds: 5, epochs: 60}
value_model:
  candidate_dim: 32
  hidden: [256, 128]
  dropout: 0.10
  lr: 0.001
  weight_decay: 0.00001
  batch_size: 512
  epochs: 100
  ranking_weight: 0.50
  ranking_tolerance: 0.01
policy:
  initial_subset: [1, 0, 0]
  tau: 0.01
  beta: 0.0
  lambda_cost: 0.0
  costs: [1.0, 1.0, 1.0]
baselines: {direct_epochs: 100, direct_lr: 0.001, rl_epochs: 30, rl_lr: 0.001, rl_gamma: 0.95}
evaluation: {gain_bins: 8, bootstrap_resamples: 10000}
